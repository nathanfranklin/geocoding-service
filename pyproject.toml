[project]
name = "geocoding-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "nathan.franklin@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "osmium>=4.3.1",
    "shapely>=2.1.2",
